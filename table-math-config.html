<style>
/* Natural column widths for short data tables; retain local mobile scrolling. */
main table.compact-data-table {
  width: auto;
  min-width: 0;
  max-width: 100%;
  margin-inline: auto;
  table-layout: auto;
}
main table.compact-data-table th,
main table.compact-data-table td {
  padding: 0.4em 1em;
  vertical-align: middle;
  overflow-wrap: normal;
  word-break: normal;
}
</style>
<script>
// kable HTML cells retain $...$ delimiters; Pandoc's normal prose uses \(...\).
// Support both without changing the table data, markup, or print rendering.
window.MathJax = {
  tex: {
    inlineMath: { "[+]": [["$", "$"]] },
    processEscapes: true
  }
};
</script>
