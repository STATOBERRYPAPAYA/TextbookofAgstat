<svg role="img" viewBox="1.6104873949579834 30.49076923076923 600.0418727490996 313.0746153846154" xmlns="http://www.w3.org/2000/svg" style="max-height: 500px" width="600.0418727490996" height="313.0746153846154">
<title>Semicircle showing the geometric mean as the perpendicular to the arc</title>
<desc>A semicircle on a diameter split into segment a and segment b. A perpendicular rises from the split point to the arc; its length is the square root of a times b, the geometric mean. Lines from that arc point to both diameter ends meet at a right angle.</desc>
<rect fill="#ffffff" height="350" width="640" y="0" x="0"/>
<path stroke-width="1.3" stroke="#8a8a8a" fill="none" d="M 55 300 A 250.0 250.0 0 0 1 555.0 300"/>
<line stroke-width="1.1" stroke="#8a8a8a" y2="70.9" x2="205.0" y1="300" x1="55"/>
<line stroke-width="1.1" stroke="#8a8a8a" y2="300" x2="555.0" y1="70.9" x1="205.0"/>
<line stroke-width="2.6" stroke="#6aa84f" y2="300" x2="205.0" y1="300" x1="55"/>
<line stroke-width="2.6" stroke="#3c78d8" y2="300" x2="555.0" y1="300" x1="205.0"/>
<line stroke-width="2.4" stroke="#c0392b" y2="70.9" x2="205.0" y1="300" x1="205.0"/>
<path stroke-width="1.1" stroke="#000000" fill="none" d="M 217.0 300 L 217.0 288 L 205.0 288"/>
<path stroke-width="1.1" stroke="#000000" fill="none" d="M 197.9 81.7 L 208.8 88.9 L 215.9 78.0"/>
<text fill="#000000" font-size="21" font-family="Georgia, serif" text-anchor="start" y="185.435607626104" x="221.0"><tspan font-style="italic">√<tspan text-decoration="overline">ab</tspan></tspan> = GM</text>
<text fill="#6aa84f" font-style="italic" font-size="21" font-family="Georgia, serif" text-anchor="middle" y="330" x="130">a</text>
<text fill="#3c78d8" font-style="italic" font-size="21" font-family="Georgia, serif" text-anchor="middle" y="330" x="380">b</text>
</svg>