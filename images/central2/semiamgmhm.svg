<svg role="img" viewBox="1.6608151260504205 20.774814196242172 596.6114765906362 293.5242171189979" xmlns="http://www.w3.org/2000/svg" style="max-height: 500px" width="596.6114765906362" height="293.5242171189979">
<title>Semicircle proof that AM is at least GM is at least HM</title>
<desc>A semicircle on diameter a plus b. A purple perpendicular of length root a b (GM) rises from the a-b split point to the arc and also serves as a line to the centre. Dropping a perpendicular from the split point onto the line to the centre cuts off a segment equal to the harmonic mean 2 over (1/a plus 1/b). The line to the centre is the arithmetic mean (a+b)/2. Thus AM is at least GM is at least HM.</desc>
<rect fill="#ffffff" height="380" width="660" y="0" x="0"/>
<path stroke-width="1.3" stroke="#9a9a9a" fill="none" d="M 55 280 A 250.0 250.0 0 0 1 555.0 280"/>
<line stroke-width="2.6" stroke="#6aa84f" y2="280" x2="205.0" y1="280" x1="55"/>
<line stroke-width="2.6" stroke="#3c78d8" y2="280" x2="555.0" y1="280" x1="205.0"/>
<line stroke-width="2.4" stroke="#c0392b" y2="50.9" x2="205.0" y1="280" x1="205.0"/>
<line stroke-width="2.6" stroke="#8e44ad" y2="243.3" x2="289.0" y1="50.9" x1="205.0"/>
<line stroke-width="2.2" stroke="#000000" y2="280" x2="305.0" y1="243.3" x1="289.0"/>
<line stroke-width="1.2" stroke="#9a9a9a" y2="243.3" x2="289.0" y1="280" x1="205.0"/>
<path stroke-width="1.1" stroke="#000000" fill="none" d="M 216.0 280 L 216.0 269 L 205.0 269"/>
<path stroke-width="1.1" stroke="#000000" fill="none" d="M 284.6 233.3 L 274.5 237.7 L 278.9 247.7"/>
<g transform="translate(191.0,165) rotate(-90)"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" stroke="#000000" fill="none" d="M -46 -6 L -42 -2 L -37 -16 L 6 -16"/><text fill="#000000" font-style="italic" font-size="19" font-family="Georgia, serif" text-anchor="start" y="0" x="-32">ab</text><text fill="#000000" font-size="19" font-family="Georgia, serif" text-anchor="start" y="0" x="12">= GM</text></g>
<text fill="#000000" font-size="19" font-family="Georgia, serif" text-anchor="middle" y="106" x="350">2</text>
<line stroke-width="1.4" stroke="#000000" y2="113" x2="414" y1="113" x1="286"/>
<text fill="#000000" font-size="19" font-family="Georgia, serif" text-anchor="start" y="135" x="305">1/</text><text fill="#000000" font-style="italic" font-size="19" font-family="Georgia, serif" text-anchor="start" y="135" x="322">a</text><text fill="#000000" font-size="19" font-family="Georgia, serif" text-anchor="start" y="135" x="336">+ 1/</text><text fill="#000000" font-style="italic" font-size="19" font-family="Georgia, serif" text-anchor="start" y="135" x="378">b</text>
<text fill="#000000" font-size="19" font-family="Georgia, serif" text-anchor="start" y="121" x="426">= HM</text>
<text fill="#000000" font-style="italic" font-size="19" font-family="Georgia, serif" text-anchor="middle" y="206" x="350">a + b</text>
<line stroke-width="1.4" stroke="#000000" y2="213" x2="384" y1="213" x1="316"/>
<text fill="#000000" font-size="19" font-family="Georgia, serif" text-anchor="middle" y="234" x="350">2</text>
<text fill="#000000" font-size="19" font-family="Georgia, serif" text-anchor="start" y="221" x="396">= AM</text>
<text fill="#6aa84f" font-style="italic" font-size="21" font-family="Georgia, serif" text-anchor="middle" y="308" x="130">a</text>
<text fill="#3c78d8" font-style="italic" font-size="21" font-family="Georgia, serif" text-anchor="middle" y="308" x="380">b</text>
</svg>