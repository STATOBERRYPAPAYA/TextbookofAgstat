<svg role="img" viewBox="1.6769200000000002 20.226399999999998 636.7992 356.79920000000004" xmlns="http://www.w3.org/2000/svg" style="max-height: 500px" width="636.7992" height="356.79920000000004">
<title>Semicircle proof that the arithmetic mean is at least the geometric mean</title>
<desc>A semicircle on diameter a plus b. A red perpendicular of length root a b (the geometric mean) rises from the a-b split point to the arc. A black line from that point to the centre has length (a+b)/2 (the arithmetic mean) and is the hypotenuse of a right triangle, so AM is greater than or equal to GM. The horizontal leg is (b minus a)/2.</desc>
<rect fill="#ffffff" height="400" width="660" y="0" x="0"/>
<path stroke-width="1.3" stroke="#9a9a9a" fill="none" d="M 55 285 A 250.0 250.0 0 0 1 555.0 285"/>
<line stroke-width="2.6" stroke="#6aa84f" y2="285" x2="205.0" y1="285" x1="55"/>
<line stroke-width="2.6" stroke="#3c78d8" y2="285" x2="555.0" y1="285" x1="205.0"/>
<line stroke-width="2.4" stroke="#c0392b" y2="55.9" x2="205.0" y1="285" x1="205.0"/>
<line stroke-width="2.2" stroke="#000000" y2="285" x2="305.0" y1="55.9" x1="205.0"/>
<path stroke-width="1.1" stroke="#000000" fill="none" d="M 217.0 285 L 217.0 273 L 205.0 273"/>
<g transform="translate(191.0,170.435607626104) rotate(-90)"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" stroke="#000000" fill="none" d="M -46 -6 L -42 -2 L -37 -16 L 6 -16"/><text fill="#000000" font-style="italic" font-size="20" font-family="Georgia, serif" text-anchor="start" y="0" x="-32">ab</text><text fill="#000000" font-size="20" font-family="Georgia, serif" text-anchor="start" y="0" x="12">= GM</text></g>
<text fill="#000000" font-style="italic" font-size="20" font-family="Georgia, serif" text-anchor="start" y="162" x="273">a + b</text>
<line stroke-width="1.4" stroke="#000000" y2="168" x2="339" y1="168" x1="273"/>
<text fill="#000000" font-size="20" font-family="Georgia, serif" text-anchor="middle" y="190" x="303">2</text>
<text fill="#000000" font-size="20" font-family="Georgia, serif" text-anchor="start" y="176" x="349">= AM</text>
<path stroke-width="1.2" stroke="#000000" fill="none" d="M 205.0 295 C 205.0 303, 249.0 299, 255.0 307 C 261.0 299, 305.0 303, 305.0 295"/>
<text fill="#000000" font-style="italic" font-size="20" font-family="Georgia, serif" text-anchor="middle" y="335" x="255">b − a</text>
<line stroke-width="1.4" stroke="#000000" y2="341" x2="279" y1="341" x1="231"/>
<text fill="#000000" font-size="20" font-family="Georgia, serif" text-anchor="middle" y="363" x="255">2</text>
<text fill="#6aa84f" font-style="italic" font-size="21" font-family="Georgia, serif" text-anchor="middle" y="313" x="130">a</text>
<text fill="#3c78d8" font-style="italic" font-size="21" font-family="Georgia, serif" text-anchor="middle" y="313" x="430">b</text>
<text fill="#000000" font-size="21" font-family="Georgia, serif" text-anchor="end" y="52" x="630">AM ≥ GM</text>
</svg>