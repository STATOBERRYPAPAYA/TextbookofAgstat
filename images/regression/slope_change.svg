<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#ffffff"/>

<defs>
<style>
.m{font-family:"Times New Roman","Cambria Math",serif;fill:#111111}
.blue{fill:#1239c6;stroke:#1239c6}
.red{fill:#d91f1f;stroke:#d91f1f}
.axis{stroke:#111111;stroke-width:5;fill:none;stroke-linecap:round}
.mainline{stroke:#111111;stroke-width:4;fill:none;stroke-linecap:round}
.db{stroke:#1741df;stroke-width:3;stroke-dasharray:10 8;fill:none}
.dr{stroke:#e21c24;stroke-width:3;stroke-dasharray:10 8;fill:none}
</style>
</defs>

<!-- ================= LEFT PANEL ================= -->

<!-- Formula box -->
<rect x="45" y="70" width="455" height="190" rx="20"
      fill="#f3f6ff" stroke="#9db5e8" stroke-width="3"/>

<text x="75" y="190" class="m" font-size="67" font-style="italic">β</text>
<text x="138" y="142" class="m blue" font-size="44">change in Y</text>
<line x1="138" y1="161" x2="455" y2="161" stroke="#111111" stroke-width="3"/>
<text x="138" y="212" class="m red" font-size="44">change in X</text>
<text x="108" y="191" class="m" font-size="44">=</text>

<!-- Explanation -->
<text x="48" y="330" class="m blue" font-size="31" font-style="italic">β</text>
<text x="91" y="330" class="m" font-size="27">represents the slope of the line,</text>

<text x="91" y="375" class="m" font-size="27">i.e., the </text>
<text x="184" y="375" class="m blue" font-size="27">change in Y</text>
<text x="313" y="375" class="m" font-size="27"> for a</text>

<text x="91" y="420" class="m" font-size="27">unit </text>
<text x="143" y="420" class="m red" font-size="27">change in X</text>
<text x="274" y="420" class="m" font-size="27">.</text>

<!-- Legend: rise -->
<line x1="48" y1="505" x2="112" y2="505" class="db"/>
<text x="145" y="513" class="m blue" font-size="27">Change in Y (rise):</text>
<text x="145" y="550" class="m" font-size="23">Vertical change in the</text>
<text x="145" y="582" class="m" font-size="23">dependent variable.</text>

<!-- Legend: run -->
<line x1="48" y1="650" x2="112" y2="650" class="dr"/>
<text x="145" y="658" class="m red" font-size="27">Change in X (run):</text>
<text x="145" y="695" class="m" font-size="23">Horizontal change in the</text>
<text x="145" y="727" class="m" font-size="23">independent variable.</text>

<!-- ================= RIGHT GRAPH ================= -->

<!-- Common origin exactly at (650,790) -->
<line x1="650" y1="790" x2="650" y2="55"
      class="axis"/>

<!-- Small, identical arrowhead for Y axis -->
<path d="M650 38 L641 57 L659 57 Z" fill="#111111"/>

<line x1="590" y1="790" x2="1500" y2="790"
      class="axis"/>

<!-- Small, identical arrowhead for X axis -->
<path d="M1518 790 L1499 781 L1499 799 Z" fill="#111111"/>

<!-- Axis labels, separated from arrowheads -->
<text x="625" y="55" class="m" font-size="39" font-style="italic">y</text>
<text x="1470" y="840" class="m" font-size="39" font-style="italic">x</text>
<text x="620" y="835" class="m" font-size="30">0</text>

<!-- Slope line -->
<line x1="830" y1="545" x2="1215" y2="180"
      class="mainline"/>

<!-- Points -->
<circle cx="830" cy="545" r="11" fill="#111111"/>
<circle cx="1215" cy="180" r="11" fill="#111111"/>

<!-- Point labels with clear separation -->
<text x="755" y="500" class="m" font-size="30">(x₁, y₁)</text>
<text x="1175" y="135" class="m" font-size="30">(x₂, y₂)</text>

<!-- Run and rise -->
<line x1="830" y1="545" x2="1215" y2="545" class="dr"/>
<line x1="1215" y1="545" x2="1215" y2="180" class="db"/>

<!-- Red brace -->
<path d="M830 565
C830 586 845 597 868 597
L1177 597
C1200 597 1215 586 1215 565"
fill="none" stroke="#d91f1f" stroke-width="3"/>

<text x="1022" y="642" text-anchor="middle"
      class="m red" font-size="31">Change in X</text>

<!-- Blue brace -->
<path d="M1240 180
C1262 180 1272 196 1272 220
L1272 330
C1272 354 1282 368 1300 368
C1282 368 1272 382 1272 406
L1272 505
C1272 529 1262 545 1240 545"
fill="none" stroke="#1239c6" stroke-width="3"/>

<text x="1320" y="380" class="m blue" font-size="31">Change in Y</text>

</svg>