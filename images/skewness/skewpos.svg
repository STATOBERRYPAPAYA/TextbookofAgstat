<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img">
<title>Positively skewed distribution showing mode, median and mean</title>
<desc>A right-skewed frequency curve with a long tail toward high scores. Three vertical lines mark, from left to right, the mode (at the peak), the median and the mean, showing that for a positive skew mode is less than median is less than mean.</desc>
