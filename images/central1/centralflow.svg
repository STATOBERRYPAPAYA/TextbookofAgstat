<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1886" height="724" viewBox="0 0 1886 724">
<defs>
  <style>
    .serif { font-family:"Times New Roman","Liberation Serif",serif; fill:#000; }
    .bold { font-weight:700; }
    .keyline { fill:none; stroke:#fff; stroke-width:16; stroke-linejoin:round; }
    .border { fill:none; stroke:#111; stroke-width:4; stroke-linejoin:round; }
    .connector-key { fill:none; stroke:#fff; stroke-width:15; stroke-linecap:round; stroke-linejoin:round; }
    .connector { fill:none; stroke:#222; stroke-width:8; stroke-linecap:round; stroke-linejoin:round; }
  </style>
</defs>

<!-- TITLE BOX -->
<rect x="178" y="0" width="1530" height="178" rx="28" fill="#48c2b2"/>
<rect x="178" y="0" width="1530" height="178" rx="28" class="keyline"/>
<rect x="178" y="0" width="1530" height="178" rx="28" class="border"/>
<text x="943" y="115" text-anchor="middle" class="serif bold" font-size="68">
  Measures of Central Tendency
</text>

<!-- MAIN BRANCHING CONNECTOR -->
<path d="M943 178 V330 M943 330 H244 V470 M943 330 H1643 V470"
      class="connector-key"/>
<path d="M943 178 V330 M943 330 H244 V470 M943 330 H1643 V470"
      class="connector"/>

<!-- CENTRAL VERTICAL BRANCH -->
<path d="M943 330 V470" class="connector-key"/>
<path d="M943 330 V470" class="connector"/>

<!-- SIMPLE AVERAGES -->
<rect x="0" y="470" width="510" height="228" rx="28" fill="#9ae49f"/>
<rect x="0" y="470" width="510" height="228" rx="28" class="keyline"/>
<rect x="0" y="470" width="510" height="228" rx="28" class="border"/>
<text x="255" y="540" text-anchor="middle" class="serif bold" font-size="55">Simple</text>
<text x="255" y="612" text-anchor="middle" class="serif bold" font-size="55">Averages</text>

<!-- SPECIAL AVERAGES -->
<rect x="688" y="470" width="510" height="228" rx="28" fill="#9ae49f"/>
<rect x="688" y="470" width="510" height="228" rx="28" class="keyline"/>
<rect x="688" y="470" width="510" height="228" rx="28" class="border"/>
<text x="943" y="540" text-anchor="middle" class="serif bold" font-size="55">Special</text>
<text x="943" y="612" text-anchor="middle" class="serif bold" font-size="55">Averages</text>

<!-- POSITIONAL AVERAGES -->
<rect x="1376" y="470" width="510" height="228" rx="28" fill="#9ae49f"/>
<rect x="1376" y="470" width="510" height="228" rx="28" class="keyline"/>
<rect x="1376" y="470" width="510" height="228" rx="28" class="border"/>
<text x="1631" y="540" text-anchor="middle" class="serif bold" font-size="55">Positional</text>
<text x="1631" y="612" text-anchor="middle" class="serif bold" font-size="55">Averages</text>

</svg>
