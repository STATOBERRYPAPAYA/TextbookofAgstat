<svg role="img" viewBox="1.25769 9.654179999999998 468.5952 242.9982" xmlns="http://www.w3.org/2000/svg" style="max-height: 500px" width="468.5952" height="242.9982">
<title>Graphical determination of the mode from a histogram</title>
<desc>Histogram of five frequency bars. In the tallest (modal) bar, diagonals drawn from its top corners to the adjacent bars' inner top corners cross; a vertical dotted line from the crossing point down to the class-boundary axis marks the mode.</desc>
<defs><marker orient="auto" markerHeight="7" markerWidth="7" refY="5" refX="8" viewBox="0 0 10 10" id="ah"><path fill="#000000" d="M1 1L9 5L1 9Z"/></marker></defs>
<rect fill="#ffffff" height="300" width="480" y="0" x="0"/>
<line marker-end="url(#ah)" stroke-width="2" stroke="#000000" y2="30" x2="45" y1="200" x1="45"/>
<line marker-end="url(#ah)" stroke-width="2" stroke="#000000" y2="200" x2="460" y1="200" x1="45"/>
<rect stroke-width="1.5" stroke="#000000" fill="none" height="70" width="60" y="130" x="70"/>
<rect stroke-width="1.5" stroke="#000000" fill="none" height="105" width="60" y="95" x="130"/>
<rect stroke-width="1.5" stroke="#000000" fill="none" height="150" width="60" y="50" x="190"/>
<rect stroke-width="1.5" stroke="#000000" fill="none" height="130" width="60" y="70" x="250"/>
<rect stroke-width="1.5" stroke="#000000" fill="none" height="85" width="60" y="115" x="310"/>
<line stroke-dasharray="2 2" stroke-width="1" stroke="#000000" y2="70" x2="250" y1="50" x1="190"/>
<line stroke-dasharray="2 2" stroke-width="1" stroke="#000000" y2="95" x2="190" y1="50" x1="250"/>
<line stroke-width="1.5" stroke="#000000" y2="50" x2="250" y1="50" x1="190"/>
<line marker-end="url(#ah)" stroke-dasharray="3 3" stroke-width="1.5" stroke="#000000" y2="200" x2="231.5" y1="63.8" x1="231.5"/>
<text fill="#000000" font-style="italic" font-size="15" font-family="Georgia, serif" text-anchor="end" y="47" x="187">A</text>
<text fill="#000000" font-style="italic" font-size="15" font-family="Georgia, serif" text-anchor="start" y="47" x="253">B</text>
<text fill="#000000" font-style="italic" font-size="15" font-family="Georgia, serif" text-anchor="end" y="93" x="187">F</text>
<text fill="#000000" font-style="italic" font-size="15" font-family="Georgia, serif" text-anchor="start" y="68" x="253">E</text>
<text fill="#000000" font-style="italic" font-size="15" font-family="Georgia, serif" text-anchor="middle" y="216" x="184">D</text>
<text fill="#000000" font-style="italic" font-size="15" font-family="Georgia, serif" text-anchor="middle" y="216" x="256">C</text>
<line marker-end="url(#ah)" stroke-width="1.5" stroke="#000000" y2="206" x2="231.5" y1="230" x1="231.5"/>
<text fill="#000000" font-size="15" font-family="Georgia, serif" text-anchor="middle" y="248" x="231.5">Mode</text>
<text transform="rotate(-90 15 115)" fill="#000000" font-size="16" font-family="Georgia, serif" text-anchor="middle" y="115" x="15">Frequency</text>
<text fill="#000000" font-size="15" font-family="Georgia, serif" text-anchor="start" y="220" x="360">Class boundary</text>
</svg>