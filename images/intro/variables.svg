<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="823" viewBox="0 0 2048 823">
<defs>
  <style>
    .serif { font-family:"Times New Roman","Liberation Serif",serif; fill:#000; font-weight:700; }
    .line { fill:none; stroke:#42c4b5; stroke-width:8; stroke-linecap:square; stroke-linejoin:miter; }
    .main { fill:#46c2b2; stroke:#000; stroke-width:4; }
    .second { fill:#98e49f; stroke:#000; stroke-width:4; }
    .third { fill:#d7ffad; stroke:#000; stroke-width:4; }
  </style>
</defs>

<!-- Main heading -->
<rect x="853" y="24" width="338" height="128" rx="20" class="main"/>
<text x="1022" y="103" text-anchor="middle" class="serif" font-size="47">Variables</text>

<!-- Main branching line -->
<path d="M1022 152 L1022 229 L514 229 L514 284" class="line"/>
<path d="M1022 229 L1524 229 L1524 284" class="line"/>

<!-- Quantitative -->
<rect x="349" y="284" width="330" height="128" rx="20" class="second"/>
<text x="514" y="362" text-anchor="middle" class="serif" font-size="43">Quantitative</text>

<!-- Categorical -->
<rect x="1359" y="284" width="330" height="128" rx="20" class="second"/>
<text x="1524" y="331" text-anchor="middle" class="serif" font-size="39">Categorical</text>
<text x="1524" y="384" text-anchor="middle" class="serif" font-size="38">(Qualitative)</text>

<!-- Quantitative branch -->
<path d="M514 412 L514 474 L309 474 L309 538" class="line"/>
<path d="M514 474 L721 474 L721 538" class="line"/>

<!-- Categorical branch -->
<path d="M1524 412 L1524 474 L1319 474 L1319 538" class="line"/>
<path d="M1524 474 L1729 474 L1729 538" class="line"/>

<!-- Continuous -->
<rect x="154" y="539" width="310" height="169" rx="20" class="third"/>
<text x="309" y="600" text-anchor="middle" class="serif" font-size="39">Continuous</text>
<text x="309" y="657" text-anchor="middle" class="serif" font-size="31">E.g: Height, Mass</text>

<!-- Discrete -->
<rect x="555" y="539" width="333" height="169" rx="20" class="third"/>
<text x="721" y="600" text-anchor="middle" class="serif" font-size="39">Discrete</text>
<text x="721" y="646" text-anchor="middle" class="serif" font-size="30">E.g: Number</text>
<text x="721" y="690" text-anchor="middle" class="serif" font-size="30">of students</text>

<!-- Nominal -->
<rect x="1156" y="539" width="326" height="169" rx="20" class="third"/>
<text x="1319" y="600" text-anchor="middle" class="serif" font-size="39">Nominal</text>
<text x="1319" y="657" text-anchor="middle" class="serif" font-size="31">E.g: Colour</text>

<!-- Ordinal -->
<rect x="1563" y="539" width="333" height="169" rx="20" class="third"/>
<text x="1729" y="600" text-anchor="middle" class="serif" font-size="39">Ordinal</text>
<text x="1729" y="646" text-anchor="middle" class="serif" font-size="30">E.g: Ranks,</text>
<text x="1729" y="690" text-anchor="middle" class="serif" font-size="30">Grades</text>

</svg>
