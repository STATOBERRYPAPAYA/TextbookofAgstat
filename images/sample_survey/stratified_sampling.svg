<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="896" viewBox="0 0 1536 896">
<defs>
  <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8f0ff"/><stop offset="1" stop-color="#dbe6fa"/></linearGradient>
  <linearGradient id="yellow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff9e9"/><stop offset="1" stop-color="#fff4d5"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef8e8"/><stop offset="1" stop-color="#e5f1de"/></linearGradient>
  <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7efff"/><stop offset="1" stop-color="#eee4f8"/></linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9e9"/><stop offset="1" stop-color="#ffdddd"/></linearGradient>
  <style>
    .serif { font-family:"Times New Roman","Liberation Serif",serif; fill:#111; }
    .title { font-size:38px; font-weight:700; fill:#102a63; letter-spacing:.4px; }
    .large { font-size:27px; }
    .medium { font-size:24px; }
    .small { font-size:22px; }
    .box { stroke-width:2; }
    .flow_nohead { fill:none; stroke:#111; stroke-width:3; }
    .plain { fill:none; stroke:#111; stroke-width:3; }
    .dash { fill:none; stroke-width:2; stroke-dasharray:10 8; }
  </style>
</defs>

<!-- TITLE -->
<text x="768" y="57" text-anchor="middle" class="serif title">STRATIFIED SAMPLING</text>

<!-- POPULATION -->
<rect x="392" y="84" width="662" height="103" rx="11" fill="url(#yellow)" stroke="#b17c00" class="box"/>
<text x="723" y="124" text-anchor="middle" class="serif large">Population of size <tspan font-style="italic">N</tspan></text>
<text x="723" y="158" text-anchor="middle" class="serif large">divided into <tspan font-style="italic">L</tspan> non-overlapping strata</text>

<!-- Population definitions -->
<rect x="1113" y="81" width="311" height="122" rx="10" fill="url(#blue)" stroke="#2d63bb" class="box"/>
<text x="1134" y="119" class="serif medium"><tspan font-style="italic">L</tspan> = number of strata</text>
<text x="1134" y="151" class="serif medium"><tspan font-style="italic">N</tspan><tspan baseline-shift="sub" font-size="17">h</tspan> = size of <tspan font-style="italic">h</tspan><tspan baseline-shift="super" font-size="17">th</tspan> stratum</text>
<text x="1134" y="183" class="serif medium"><tspan font-style="italic">N</tspan> = ∑<tspan baseline-shift="sub" font-size="16">h=1</tspan><tspan baseline-shift="super" font-size="16">L</tspan> <tspan font-style="italic">N</tspan><tspan baseline-shift="sub" font-size="17">h</tspan></text>
<path d="M1054 136 L1113 136" stroke="#2d63bb" stroke-width="2"/>

<!-- DOWN -->
<path d="M723 187 L723 230" class="flow_nohead"/>

<!-- SAMPLE FROM EACH STRATUM -->
<rect x="392" y="230" width="662" height="99" rx="11" fill="url(#green)" stroke="#628b52" class="box"/>
<text x="723" y="268" text-anchor="middle" class="serif large">From each stratum <tspan font-style="italic">h</tspan> (<tspan font-style="italic">h</tspan> = 1, 2, . . . , <tspan font-style="italic">L</tspan>)</text>
<text x="723" y="305" text-anchor="middle" class="serif large">draw a simple random sample of size <tspan font-style="italic">n</tspan><tspan baseline-shift="sub" font-size="18">h</tspan></text>

<!-- SAMPLE SIZE DEFINITIONS -->
<rect x="1114" y="220" width="313" height="123" rx="10" fill="url(#green)" stroke="#628b52" class="box"/>
<text x="1135" y="258" class="serif medium"><tspan font-style="italic">n</tspan><tspan baseline-shift="sub" font-size="17">h</tspan> = sample size from <tspan font-style="italic">h</tspan><tspan baseline-shift="super" font-size="16">th</tspan> stratum</text>
<text x="1135" y="290" class="serif medium"><tspan font-style="italic">n</tspan> = ∑<tspan baseline-shift="sub" font-size="16">h=1</tspan><tspan baseline-shift="super" font-size="16">L</tspan> <tspan font-style="italic">n</tspan><tspan baseline-shift="sub" font-size="17">h</tspan></text>
<text x="1135" y="322" class="serif small">(Total sample size)</text>
<path d="M1054 277 L1114 277" stroke="#4f8a39" stroke-width="2"/>

<path d="M723 329 L723 366" class="flow_nohead"/>

<!-- BRANCH LINE -->
<path d="M205 366 L1235 366" class="plain"/>
<path d="M205 366 L205 399" class="flow_nohead"/>
<path d="M507 366 L507 399" class="flow_nohead"/>
<path d="M917 366 L917 399" class="flow_nohead"/>
<path d="M1235 366 L1235 399" class="flow_nohead"/>

<!-- STRATUM BOXES -->
<rect x="88" y="400" width="236" height="83" rx="9" fill="url(#blue)" stroke="#2d63bb" class="box"/>
<text x="206" y="433" text-anchor="middle" class="serif large">Stratum 1</text>
<text x="206" y="466" text-anchor="middle" class="serif large">Size <tspan font-style="italic">N</tspan><tspan baseline-shift="sub" font-size="18">1</tspan></text>

<rect x="389" y="400" width="236" height="83" rx="9" fill="url(#blue)" stroke="#2d63bb" class="box"/>
<text x="507" y="433" text-anchor="middle" class="serif large">Stratum 2</text>
<text x="507" y="466" text-anchor="middle" class="serif large">Size <tspan font-style="italic">N</tspan><tspan baseline-shift="sub" font-size="18">2</tspan></text>

<text x="716" y="454" text-anchor="middle" class="serif" font-size="31">• • •</text>

<rect x="799" y="400" width="235" height="83" rx="9" fill="url(#blue)" stroke="#2d63bb" class="box"/>
<text x="916.5" y="433" text-anchor="middle" class="serif large">Stratum <tspan font-style="italic">h</tspan></text>
<text x="916.5" y="466" text-anchor="middle" class="serif large">Size <tspan font-style="italic">N</tspan><tspan baseline-shift="sub" font-size="18">h</tspan></text>

<rect x="1118" y="400" width="235" height="83" rx="9" fill="url(#blue)" stroke="#2d63bb" class="box"/>
<text x="1235.5" y="433" text-anchor="middle" class="serif large">Stratum <tspan font-style="italic">L</tspan></text>
<text x="1235.5" y="466" text-anchor="middle" class="serif large">Size <tspan font-style="italic">N</tspan><tspan baseline-shift="sub" font-size="18">L</tspan></text>

<!-- RANDOM SAMPLE BOXES -->
<path d="M206 483 L206 517" class="flow_nohead"/>
<path d="M507 483 L507 517" class="flow_nohead"/>
<path d="M917 483 L917 517" class="flow_nohead"/>
<path d="M1235 483 L1235 517" class="flow_nohead"/>

<rect x="88" y="518" width="236" height="78" rx="9" fill="url(#purple)" stroke="#7d5aaf" class="box"/>
<text x="206" y="550" text-anchor="middle" class="serif medium">Select a random</text>
<text x="206" y="581" text-anchor="middle" class="serif medium">sample of size <tspan font-style="italic">n</tspan><tspan baseline-shift="sub" font-size="17">1</tspan></text>

<rect x="389" y="518" width="236" height="78" rx="9" fill="url(#purple)" stroke="#7d5aaf" class="box"/>
<text x="507" y="550" text-anchor="middle" class="serif medium">Select a random</text>
<text x="507" y="581" text-anchor="middle" class="serif medium">sample of size <tspan font-style="italic">n</tspan><tspan baseline-shift="sub" font-size="17">2</tspan></text>

<text x="716" y="565" text-anchor="middle" class="serif" font-size="31">• • •</text>

<rect x="799" y="518" width="235" height="78" rx="9" fill="url(#purple)" stroke="#7d5aaf" class="box"/>
<text x="916.5" y="550" text-anchor="middle" class="serif medium">Select a random</text>
<text x="916.5" y="581" text-anchor="middle" class="serif medium">sample of size <tspan font-style="italic">n</tspan><tspan baseline-shift="sub" font-size="17">h</tspan></text>

<rect x="1118" y="518" width="235" height="78" rx="9" fill="url(#purple)" stroke="#7d5aaf" class="box"/>
<text x="1235.5" y="550" text-anchor="middle" class="serif medium">Select a random</text>
<text x="1235.5" y="581" text-anchor="middle" class="serif medium">sample of size <tspan font-style="italic">n</tspan><tspan baseline-shift="sub" font-size="17">L</tspan></text>

<!-- SELECTED UNITS -->
<path d="M206 596 L206 630" class="flow_nohead"/>
<path d="M507 596 L507 630" class="flow_nohead"/>
<path d="M917 596 L917 630" class="flow_nohead"/>
<path d="M1235 596 L1235 630" class="flow_nohead"/>

<rect x="88" y="631" width="236" height="83" rx="9" fill="#fff" stroke="#111" class="box"/>
<circle cx="120" cy="658" r="8" fill="#15427c"/><circle cx="152" cy="658" r="8" fill="#15427c"/><circle cx="184" cy="658" r="8" fill="#15427c"/>
<text x="220" y="662" class="serif small">• • •</text><circle cx="282" cy="658" r="8" fill="#15427c"/>
<text x="206" y="700" text-anchor="middle" class="serif medium"><tspan font-style="italic">n</tspan><tspan baseline-shift="sub" font-size="17">1</tspan> units</text>

<rect x="389" y="631" width="236" height="83" rx="9" fill="#fff" stroke="#111" class="box"/>
<circle cx="421" cy="658" r="8" fill="#65319b"/><circle cx="453" cy="658" r="8" fill="#65319b"/><circle cx="485" cy="658" r="8" fill="#65319b"/>
<text x="521" y="662" class="serif small">• • •</text><circle cx="583" cy="658" r="8" fill="#65319b"/>
<text x="507" y="700" text-anchor="middle" class="serif medium"><tspan font-style="italic">n</tspan><tspan baseline-shift="sub" font-size="17">2</tspan> units</text>

<text x="716" y="674" text-anchor="middle" class="serif" font-size="31">• • •</text>

<rect x="799" y="631" width="235" height="83" rx="9" fill="#fff" stroke="#111" class="box"/>
<circle cx="831" cy="658" r="8" fill="#2f6d2f"/><circle cx="863" cy="658" r="8" fill="#2f6d2f"/><circle cx="895" cy="658" r="8" fill="#2f6d2f"/>
<text x="931" y="662" class="serif small">• • •</text><circle cx="993" cy="658" r="8" fill="#2f6d2f"/>
<text x="916.5" y="700" text-anchor="middle" class="serif medium"><tspan font-style="italic">n</tspan><tspan baseline-shift="sub" font-size="17">h</tspan> units</text>

<rect x="1118" y="631" width="235" height="83" rx="9" fill="#fff" stroke="#111" class="box"/>
<circle cx="1150" cy="658" r="8" fill="#b21c1c"/><circle cx="1182" cy="658" r="8" fill="#b21c1c"/><circle cx="1214" cy="658" r="8" fill="#b21c1c"/>
<text x="1250" y="662" class="serif small">• • •</text><circle cx="1312" cy="658" r="8" fill="#b21c1c"/>
<text x="1235.5" y="700" text-anchor="middle" class="serif medium"><tspan font-style="italic">n</tspan><tspan baseline-shift="sub" font-size="17">L</tspan> units</text>

<!-- COMBINE -->
<path d="M206 714 L206 749 L1235 749 L1235 714" class="plain"/>
<path d="M507 714 L507 749 M917 714 L917 749" class="plain"/>
<path d="M723 749 L723 787" class="flow_nohead"/>

<rect x="370" y="789" width="655" height="96" rx="10" fill="url(#red)" stroke="#df2b2b" class="box"/>
<text x="697.5" y="826" text-anchor="middle" class="serif large">Combine all selected units from the <tspan font-style="italic">L</tspan> strata</text>
<text x="697.5" y="860" text-anchor="middle" class="serif large">Final sample size <tspan font-style="italic">n</tspan> = ∑<tspan baseline-shift="sub" font-size="17">h=1</tspan><tspan baseline-shift="super" font-size="17">L</tspan> <tspan font-style="italic">n</tspan><tspan baseline-shift="sub" font-size="17">h</tspan></text>

<!-- Final note -->
<rect x="1082" y="801" width="324" height="67" rx="10" fill="url(#red)" class="dash" stroke="#df2b2b"/>
<text x="1244" y="842" text-anchor="middle" class="serif medium">The sample contains <tspan font-style="italic">n</tspan><tspan baseline-shift="sub" font-size="17">h</tspan> units</text>
<text x="1244" y="865" text-anchor="middle" class="serif medium">from stratum <tspan font-style="italic">h</tspan></text>
<path d="M1025 833 L1082 833" stroke="#df2b2b" stroke-width="2" stroke-dasharray="10 8"/>

</svg>
