<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
<defs>
  <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8f0ff"/><stop offset="1" stop-color="#dbe6fa"/></linearGradient>
  <linearGradient id="yellow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff9e9"/><stop offset="1" stop-color="#fff5d8"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef8e8"/><stop offset="1" stop-color="#e6f2df"/></linearGradient>
  <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6edff"/><stop offset="1" stop-color="#eee3f8"/></linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2df"/><stop offset="1" stop-color="#ffebd5"/></linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe8e8"/><stop offset="1" stop-color="#ffdede"/></linearGradient>
  <style>
    .serif { font-family:"Times New Roman", "Liberation Serif", serif; fill:#111; }
    .title { font-size:40px; font-weight:700; letter-spacing:.5px; fill:#102a63; }
    .big { font-size:28px; }
    .med { font-size:25px; }
    .small { font-size:23px; }
    .bold { font-weight:700; }
    .box { stroke-width:2; }
    .dash { fill:none; stroke-width:2; stroke-dasharray:10 8; }
    .flow { fill:none; stroke:#111; stroke-width:3;  }
    .connector { fill:none; stroke-width:2; stroke-dasharray:10 8; }
  </style>
</defs>

<!-- Title -->
<rect x="365" y="20" width="593" height="59" rx="12" fill="url(#blue)" stroke="#2d63bb" stroke-width="2"/>
<text x="661.5" y="60" text-anchor="middle" class="serif title">CLUSTER SAMPLING</text>

<!-- Main population box -->
<rect x="402" y="119" width="525" height="110" rx="10" fill="url(#yellow)" stroke="#c59600" class="box"/>
<text x="664.5" y="163" text-anchor="middle" class="serif big">Population divided into <tspan font-style="italic">N</tspan> clusters</text>
<text x="664.5" y="201" text-anchor="middle" class="serif big">Each cluster has size <tspan font-style="italic">M</tspan></text>

<!-- Population note -->
<rect x="1074" y="120" width="330" height="130" rx="10" fill="url(#yellow)" class="dash" stroke="#c59600"/>
<text x="1239" y="160" text-anchor="middle" class="serif med">Number of clusters = <tspan font-style="italic">N</tspan></text>
<text x="1239" y="195" text-anchor="middle" class="serif med">Size of each cluster = <tspan font-style="italic">M</tspan></text>
<text x="1239" y="230" text-anchor="middle" class="serif med">Population size = <tspan font-style="italic">NM</tspan></text>
<path d="M927 177 L1074 177" class="connector" stroke="#c59600"/>

<!-- Flow -->
<path d="M664 80 L664 117" class="flow"/>
<path d="M664 230 L664 268" class="flow"/>

<!-- Sampling frame -->
<rect x="402" y="269" width="525" height="56" rx="8" fill="url(#green)" stroke="#628b52" class="box"/>
<text x="664.5" y="305" text-anchor="middle" class="serif big">List (sampling frame) of <tspan font-style="italic">N</tspan> clusters</text>
<path d="M664 325 L664 364" class="flow"/>

<!-- Randomly select -->
<rect x="402" y="366" width="525" height="98" rx="10" fill="url(#purple)" stroke="#8b67b4" class="box"/>
<text x="664.5" y="405" text-anchor="middle" class="serif big">Randomly select <tspan font-style="italic">n</tspan> clusters</text>
<text x="664.5" y="443" text-anchor="middle" class="serif big">(<tspan font-style="italic">n</tspan> &lt; <tspan font-style="italic">N</tspan>)</text>

<!-- selection note -->
<rect x="1059" y="387" width="378" height="62" rx="10" fill="url(#purple)" class="dash" stroke="#8b67b4"/>
<text x="1248" y="426" text-anchor="middle" class="serif med">Number of clusters selected = <tspan font-style="italic">n</tspan></text>
<path d="M927 417 L1059 417" class="connector" stroke="#8b67b4"/>

<!-- branching line -->
<path d="M664 464 L664 492 M218 492 L1054 492" fill="none" stroke="#111" stroke-width="3"/>
<path d="M218 492 L218 523" class="flow"/>
<path d="M537 492 L537 523" class="flow"/>
<path d="M1054 492 L1054 523" class="flow"/>

<!-- selected cluster boxes -->
<rect x="103" y="525" width="233" height="89" rx="9" fill="url(#blue)" stroke="#2d63bb" class="box"/>
<text x="219.5" y="559" text-anchor="middle" class="serif big">Selected</text>
<text x="219.5" y="595" text-anchor="middle" class="serif big">Cluster 1</text>

<rect x="426" y="525" width="222" height="89" rx="9" fill="url(#blue)" stroke="#2d63bb" class="box"/>
<text x="537" y="559" text-anchor="middle" class="serif big">Selected</text>
<text x="537" y="595" text-anchor="middle" class="serif big">Cluster 2</text>

<text x="788" y="572" text-anchor="middle" class="serif" font-size="34">• • • • •</text>

<rect x="938" y="525" width="232" height="89" rx="9" fill="url(#blue)" stroke="#2d63bb" class="box"/>
<text x="1054" y="559" text-anchor="middle" class="serif big">Selected</text>
<text x="1054" y="595" text-anchor="middle" class="serif big">Cluster <tspan font-style="italic">n</tspan></text>

<!-- observation boxes -->
<path d="M219 614 L219 656" class="flow"/>
<path d="M537 614 L537 656" class="flow"/>
<path d="M1054 614 L1054 656" class="flow"/>

<rect x="79" y="657" width="280" height="118" rx="9" fill="url(#orange)" stroke="#d77b32" class="box"/>
<text x="219" y="691" text-anchor="middle" class="serif med">Observe all <tspan font-style="italic">M</tspan></text>
<text x="219" y="727" text-anchor="middle" class="serif med">units in Cluster 1</text>
<text x="219" y="762" text-anchor="middle" class="serif med">(completely enumerate)</text>

<rect x="398" y="657" width="280" height="118" rx="9" fill="url(#orange)" stroke="#d77b32" class="box"/>
<text x="538" y="691" text-anchor="middle" class="serif med">Observe all <tspan font-style="italic">M</tspan></text>
<text x="538" y="727" text-anchor="middle" class="serif med">units in Cluster 2</text>
<text x="538" y="762" text-anchor="middle" class="serif med">(completely enumerate)</text>

<text x="793" y="715" text-anchor="middle" class="serif" font-size="36">⋮</text>

<rect x="914" y="657" width="280" height="118" rx="9" fill="url(#orange)" stroke="#d77b32" class="box"/>
<text x="1054" y="691" text-anchor="middle" class="serif med">Observe all <tspan font-style="italic">M</tspan></text>
<text x="1054" y="727" text-anchor="middle" class="serif med">units in Cluster <tspan font-style="italic">n</tspan></text>
<text x="1054" y="762" text-anchor="middle" class="serif med">(completely enumerate)</text>

<!-- combine -->
<path d="M219 775 L219 819 L1054 819 L1054 775" fill="none" stroke="#111" stroke-width="3"/>
<path d="M537 775 L537 819 M664 819 L664 865" class="flow"/>
<path d="M1054 775 L1054 819" fill="none" stroke="#111" stroke-width="3"/>

<rect x="363" y="867" width="588" height="104" rx="10" fill="url(#red)" stroke="#e22b2b" stroke-width="2"/>
<text x="657" y="908" text-anchor="middle" class="serif big">Combine data from all selected clusters</text>
<text x="657" y="947" text-anchor="middle" class="serif big">Final sample size = <tspan font-style="italic">nM</tspan></text>

<!-- final note -->
<rect x="1066" y="886" width="264" height="62" rx="10" fill="url(#red)" class="dash" stroke="#e22b2b"/>
<text x="1198" y="925" text-anchor="middle" class="serif med">Sample size = <tspan font-style="italic">nM</tspan></text>
<path d="M951 918 L1066 918" class="connector" stroke="#e22b2b"/>

</svg>
