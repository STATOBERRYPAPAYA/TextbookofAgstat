<title>p-value as the right-tail area beyond the observed test statistic</title>
<desc>A normal curve with a red mean line at mu0 and a purple dotted line at the observed test statistic z-obs. The right-tail area beyond z-obs is shaded pink and marked with dots; it is the p-value. A formula and decision rules are shown: small p rejects H0, large p does not.</desc>
