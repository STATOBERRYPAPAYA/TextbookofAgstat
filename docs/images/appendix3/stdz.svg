<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
<rect width="1000" height="300" fill="#fff"/>
<defs>
<style>
.title{font-family:Arial,Helvetica,sans-serif;font-weight:700;fill:#111;font-size:25px}
.text{font-family:Arial,Helvetica,sans-serif;fill:#111;font-size:18px}
.small{font-family:Arial,Helvetica,sans-serif;fill:#111;font-size:16px}
.math{font-family:"Times New Roman",serif;fill:#111;font-size:18px;font-style:italic}
</style>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
<path d="M1,1 L9,5 L1,9 Z" fill="#111"/>
</marker>
</defs>

<text x="420" y="27" text-anchor="middle" class="title">Standard Normal Probabilities</text>

<!-- shaded area -->
<path d="M18 210
C55 210 72 194 91 166
C110 137 122 96 140 67
C151 49 158 39 164 39
C173 39 181 51 190 70
C196 83 202 98 207 112
L207 210 Z" fill="#cfcfcf"/>

<!-- normal curve -->
<path d="M18 210
C55 210 72 194 91 166
C110 137 122 96 140 67
C151 49 158 39 164 39
C173 39 181 51 190 70
C207 107 221 147 238 176
C255 202 275 210 306 210" fill="none" stroke="#111" stroke-width="2.2"/>

<!-- baseline -->
<line x1="18" y1="210" x2="306" y2="210" stroke="#111" stroke-width="2"/>

<!-- z -->
<line x1="207" y1="112" x2="207" y2="210" stroke="#111" stroke-width="2"/>
<text x="207" y="229" text-anchor="middle" class="math">z</text>

<!-- annotation -->
<text x="29" y="99" class="small">Table entry</text>
<line x1="94" y1="102" x2="143" y2="126" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- explanation -->
<text x="344" y="187" class="text">Table entry for <tspan class="math">z</tspan> is the area under the standard normal curve</text>
<text x="344" y="213" class="text">to the left of <tspan class="math">z</tspan>.</text>
</svg>