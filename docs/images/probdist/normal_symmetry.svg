<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="720" viewBox="0 0 1020 720" role="img">
<title>Normal distribution showing symmetry about the mean</title>
<desc>A symmetric bell curve split by a dashed vertical line at mu. Left half shaded blue, labelled 50 percent to the left of mu; right half shaded green, labelled 50 percent to the right. A box states mean = median = mode = mu.</desc>
