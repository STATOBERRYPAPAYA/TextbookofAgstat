<path d="M180 94l6 12 6-12z" fill="#4472c4"/>
<rect x="95" y="119" width="182" height="95" fill="#e2efda" stroke="#111" stroke-width="4"/>
<text x="186" y="176" fill="#111">T1</text>
<rect x="95" y="214" width="182" height="95" fill="#e2efda" stroke="#111" stroke-width="4"/>
<text x="186" y="271" fill="#111">T3</text>
<rect x="95" y="309" width="182" height="95" fill="#e2efda" stroke="#111" stroke-width="4"/>
<text x="186" y="366" fill="#111">T4</text>
<rect x="95" y="404" width="182" height="95" fill="#e2efda" stroke="#111" stroke-width="4"/>
<text x="186" y="461" fill="#111">T2</text>
