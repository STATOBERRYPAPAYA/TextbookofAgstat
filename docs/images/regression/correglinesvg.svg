<svg xmlns="http://www.w3.org/2000/svg" width="1534" height="748" viewBox="0 0 1534 748" role="img">
<title>Correlation and the angle between the two regression lines</title>
<desc>Seven panels showing how the angle between the two regression lines (X on Y in blue and Y on X in red) relates to the correlation coefficient, from perpendicular at r=0 to coincident at r=plus or minus 1, with a legend and a note that all regression lines pass through the means.</desc>
<rect x="0" y="0" width="1534" height="748" fill="#ffffff"/>
<rect x="20" y="20" width="360" height="300" rx="10" fill="#ffffff" stroke="#c9c9d4" stroke-width="1.2"/>
<path d="M21 66 L21 31 Q21 21 31 21 L369 21 Q379 21 379 31 L379 66 Z" fill="#e6e2f7"/>
<line x1="21" y1="66" x2="379" y2="66" stroke="#c9c9d4" stroke-width="1"/>
<text x="200.0" y="49" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#1a1a1a">(a) No correlation (r = 0)</text>
<line x1="60" y1="246" x2="60" y2="80" stroke="#000" stroke-width="1.8"/>
<path d="M60.0 79.0 L56.0 87.0 L64.0 87.0 Z" fill="#000"/>
<line x1="60" y1="246" x2="350" y2="246" stroke="#000" stroke-width="1.8"/>
<path d="M351.0 246.0 L343.0 242.0 L343.0 250.0 Z" fill="#000"/>
<text x="45" y="89" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-style="italic" font-weight="bold" fill="#000">y</text>
<text x="361" y="251" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-style="italic" font-weight="bold" fill="#000">x</text>
<line x1="68.4" y1="174.9" x2="312.0" y2="174.9" stroke="#1f2ecb" stroke-width="2.4"/>
<text x="132.8" y="155.9" text-anchor="middle" font-family="Arial" font-size="13.5" font-weight="bold" fill="#1f2ecb">X on Y</text>
<line x1="222.4" y1="241.3" x2="222.4" y2="92.7" stroke="#e01b1b" stroke-width="2.4"/>
<text x="256.0" y="127.5" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="bold" fill="#e01b1b">Y on X</text>
<text x="200.0" y="280" text-anchor="middle" font-family="Arial" font-size="13" fill="#222">Regression lines are perpendicular</text>
<text x="200.0" y="298" text-anchor="middle" font-family="Arial" font-size="13" fill="#222">(90°) to each other.</text>
<rect x="398" y="20" width="360" height="300" rx="10" fill="#ffffff" stroke="#c9c9d4" stroke-width="1.2"/>
<path d="M399 66 L399 31 Q399 21 409 21 L747 21 Q757 21 757 31 L757 66 Z" fill="#e4f5e4"/>
<line x1="399" y1="66" x2="757" y2="66" stroke="#c9c9d4" stroke-width="1"/>
<text x="578.0" y="49" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#1a1a1a">(b) Perfect positive correlation (r = +1)</text>
<line x1="438" y1="246" x2="438" y2="80" stroke="#000" stroke-width="1.8"/>
<path d="M438.0 79.0 L434.0 87.0 L442.0 87.0 Z" fill="#000"/>
<line x1="438" y1="246" x2="728" y2="246" stroke="#000" stroke-width="1.8"/>
<path d="M729.0 246.0 L721.0 242.0 L721.0 250.0 Z" fill="#000"/>
<text x="423" y="89" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-style="italic" font-weight="bold" fill="#000">y</text>
<text x="739" y="251" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-style="italic" font-weight="bold" fill="#000">x</text>
<line x1="449.2" y1="238.1" x2="698.4" y2="95.9" stroke="#1f2ecb" stroke-width="2.4"/>
<text x="488.4" y="192.3" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="bold" fill="#1f2ecb">X on Y</text>
<line x1="457.6" y1="233.4" x2="690.0" y2="100.6" stroke="#e01b1b" stroke-width="2.4"/>
<text x="667.6" y="110.1" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="bold" fill="#e01b1b">Y on X</text>
<text x="578.0" y="280" text-anchor="middle" font-family="Arial" font-size="13" fill="#222">Regression lines coincide.</text>
<text x="578.0" y="298" text-anchor="middle" font-family="Arial" font-size="13" fill="#222">(Angle = 0°)</text>
<rect x="776" y="20" width="360" height="300" rx="10" fill="#ffffff" stroke="#c9c9d4" stroke-width="1.2"/>
<path d="M777 66 L777 31 Q777 21 787 21 L1125 21 Q1135 21 1135 31 L1135 66 Z" fill="#e4f5e4"/>
<line x1="777" y1="66" x2="1135" y2="66" stroke="#c9c9d4" stroke-width="1"/>
<text x="956.0" y="49" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#1a1a1a">(c) Perfect negative correlation (r = −1)</text>
<line x1="816" y1="246" x2="816" y2="80" stroke="#000" stroke-width="1.8"/>
<path d="M816.0 79.0 L812.0 87.0 L820.0 87.0 Z" fill="#000"/>
<line x1="816" y1="246" x2="1106" y2="246" stroke="#000" stroke-width="1.8"/>
<path d="M1107.0 246.0 L1099.0 242.0 L1099.0 250.0 Z" fill="#000"/>
<text x="801" y="89" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-style="italic" font-weight="bold" fill="#000">y</text>
<text x="1117" y="251" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-style="italic" font-weight="bold" fill="#000">x</text>
<line x1="827.2" y1="94.3" x2="1076.4" y2="238.1" stroke="#1f2ecb" stroke-width="2.4"/>
<text x="911.2" y="113.3" text-anchor="middle" font-family="Arial" font-size="13.5" font-weight="bold" fill="#1f2ecb">X on Y</text>
<line x1="835.6" y1="99.1" x2="1068.0" y2="233.4" stroke="#e01b1b" stroke-width="2.4"/>
<text x="1040.0" y="208.1" text-anchor="middle" font-family="Arial" font-size="13.5" font-weight="bold" fill="#e01b1b">Y on X</text>
<text x="956.0" y="280" text-anchor="middle" font-family="Arial" font-size="13" fill="#222">Regression lines coincide.</text>
<text x="956.0" y="298" text-anchor="middle" font-family="Arial" font-size="13" fill="#222">(Angle = 0°)</text>
<rect x="1154" y="20" width="360" height="300" rx="10" fill="#ffffff" stroke="#c9c9d4" stroke-width="1.2"/>
<path d="M1155 66 L1155 31 Q1155 21 1165 21 L1503 21 Q1513 21 1513 31 L1513 66 Z" fill="#fdf3d0"/>
<line x1="1155" y1="66" x2="1513" y2="66" stroke="#c9c9d4" stroke-width="1"/>
<text x="1334.0" y="40" text-anchor="middle" font-family="Arial" font-size="13.5" font-weight="bold" fill="#1a1a1a">(d) High degree positive correlation</text>
<text x="1334.0" y="57" text-anchor="middle" font-family="Arial" font-size="13.5" font-weight="bold" fill="#1a1a1a">(0 &lt; r &lt; 1, close to 1)</text>
<line x1="1194" y1="246" x2="1194" y2="80" stroke="#000" stroke-width="1.8"/>
<path d="M1194.0 79.0 L1190.0 87.0 L1198.0 87.0 Z" fill="#000"/>
<line x1="1194" y1="246" x2="1484" y2="246" stroke="#000" stroke-width="1.8"/>
<path d="M1485.0 246.0 L1477.0 242.0 L1477.0 250.0 Z" fill="#000"/>
<text x="1179" y="89" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-style="italic" font-weight="bold" fill="#000">y</text>
<text x="1495" y="251" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-style="italic" font-weight="bold" fill="#000">x</text>
<line x1="1208.0" y1="198.6" x2="1446.0" y2="100.6" stroke="#1f2ecb" stroke-width="2.4"/>
<text x="1306.0" y="129.1" text-anchor="middle" font-family="Arial" font-size="13.5" font-weight="bold" fill="#1f2ecb">X on Y</text>
<line x1="1208.0" y1="211.2" x2="1454.4" y2="151.2" stroke="#e01b1b" stroke-width="2.4"/>
<text x="1423.6" y="160.7" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="bold" fill="#e01b1b">Y on X</text>
<text x="1334.0" y="280" text-anchor="middle" font-family="Arial" font-size="13" fill="#222">Lines intersect at an acute angle</text>
<text x="1334.0" y="298" text-anchor="middle" font-family="Arial" font-size="13" fill="#222">close to 0°.</text>
<rect x="209" y="338" width="360" height="300" rx="10" fill="#ffffff" stroke="#c9c9d4" stroke-width="1.2"/>
<path d="M210 384 L210 349 Q210 339 220 339 L558 339 Q568 339 568 349 L568 384 Z" fill="#fdf3d0"/>
<line x1="210" y1="384" x2="568" y2="384" stroke="#c9c9d4" stroke-width="1"/>
<text x="389.0" y="358" text-anchor="middle" font-family="Arial" font-size="13.5" font-weight="bold" fill="#1a1a1a">(e) High degree negative correlation</text>
<text x="389.0" y="375" text-anchor="middle" font-family="Arial" font-size="13.5" font-weight="bold" fill="#1a1a1a">(−1 &lt; r &lt; 0, close to −1)</text>
<line x1="249" y1="564" x2="249" y2="398" stroke="#000" stroke-width="1.8"/>
<path d="M249.0 397.0 L245.0 405.0 L253.0 405.0 Z" fill="#000"/>
<line x1="249" y1="564" x2="539" y2="564" stroke="#000" stroke-width="1.8"/>
<path d="M540.0 564.0 L532.0 560.0 L532.0 568.0 Z" fill="#000"/>
<text x="234" y="407" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-style="italic" font-weight="bold" fill="#000">y</text>
<text x="550" y="569" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-style="italic" font-weight="bold" fill="#000">x</text>
<line x1="263.0" y1="418.6" x2="501.0" y2="545.0" stroke="#1f2ecb" stroke-width="2.4"/>
<text x="366.6" y="437.6" text-anchor="middle" font-family="Arial" font-size="13.5" font-weight="bold" fill="#1f2ecb">X on Y</text>
<line x1="263.0" y1="450.2" x2="509.4" y2="519.8" stroke="#e01b1b" stroke-width="2.4"/>
<text x="305.0" y="478.7" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="bold" fill="#e01b1b">Y on X</text>
<text x="389.0" y="598" text-anchor="middle" font-family="Arial" font-size="13" fill="#222">Lines intersect at an acute angle</text>
<text x="389.0" y="616" text-anchor="middle" font-family="Arial" font-size="13" fill="#222">close to 0°.</text>
<rect x="587" y="338" width="360" height="300" rx="10" fill="#ffffff" stroke="#c9c9d4" stroke-width="1.2"/>
<path d="M588 384 L588 349 Q588 339 598 339 L936 339 Q946 339 946 349 L946 384 Z" fill="#e6e2f7"/>
<line x1="588" y1="384" x2="946" y2="384" stroke="#c9c9d4" stroke-width="1"/>
<text x="767.0" y="358" text-anchor="middle" font-family="Arial" font-size="13.5" font-weight="bold" fill="#1a1a1a">(f) Low degree negative correlation</text>
<text x="767.0" y="375" text-anchor="middle" font-family="Arial" font-size="13.5" font-weight="bold" fill="#1a1a1a">(−1 &lt; r &lt; 0, close to 0)</text>
<line x1="627" y1="564" x2="627" y2="398" stroke="#000" stroke-width="1.8"/>
<path d="M627.0 397.0 L623.0 405.0 L631.0 405.0 Z" fill="#000"/>
<line x1="627" y1="564" x2="917" y2="564" stroke="#000" stroke-width="1.8"/>
<path d="M918.0 564.0 L910.0 560.0 L910.0 568.0 Z" fill="#000"/>
<text x="612" y="407" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-style="italic" font-weight="bold" fill="#000">y</text>
<text x="928" y="569" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-style="italic" font-weight="bold" fill="#000">x</text>
<line x1="643.8" y1="421.8" x2="856.6" y2="554.5" stroke="#1f2ecb" stroke-width="2.4"/>
<text x="727.8" y="443.9" text-anchor="middle" font-family="Arial" font-size="13.5" font-weight="bold" fill="#1f2ecb">X on Y</text>
<line x1="641.0" y1="475.5" x2="887.4" y2="510.3" stroke="#e01b1b" stroke-width="2.4"/>
<text x="839.8" y="497.6" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="bold" fill="#e01b1b">Y on X</text>
<text x="767.0" y="598" text-anchor="middle" font-family="Arial" font-size="13" fill="#222">Lines intersect at an obtuse angle</text>
<text x="767.0" y="616" text-anchor="middle" font-family="Arial" font-size="13" fill="#222">(&gt; 90° and &lt; 180°).</text>
<rect x="965" y="338" width="360" height="300" rx="10" fill="#ffffff" stroke="#c9c9d4" stroke-width="1.2"/>
