<rect x="427" y="656" width="680" height="34" rx="8" fill="#ffffff" stroke="#c9c9d4" stroke-width="1.2"/>
<line x1="451" y1="673" x2="497" y2="673" stroke="#1f2ecb" stroke-width="2.6"/>
<text x="505" y="678" font-family="Arial" font-size="14" fill="#222"><tspan font-weight="bold" fill="#1f2ecb">X on Y</tspan> : Regression line of X on Y</text>
