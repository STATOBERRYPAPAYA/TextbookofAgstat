<text x="1306" y="569" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-style="italic" font-weight="bold" fill="#000">x</text>
<line x1="1019.0" y1="500.8" x2="1257.0" y2="447.1" stroke="#1f2ecb" stroke-width="2.4"/>
