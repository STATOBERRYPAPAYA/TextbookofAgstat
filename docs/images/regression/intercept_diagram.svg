<svg xmlns="http://www.w3.org/2000/svg" width="740" height="560" viewBox="0 0 740 560" role="img">
<title>Intercept alpha of a regression line</title>
<desc>A red line crosses the y-axis at height alpha, the intercept. A dashed brace from the origin up to alpha is labelled Intercept (alpha): the value of y when x equals 0.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#000"/></marker></defs>
<rect x="0" y="0" width="740" height="560" fill="#ffffff"/>
<line x1="90" y1="490" x2="90" y2="40" stroke="#000" stroke-width="2.6" marker-end="url(#ar)"/>
<line x1="90" y1="490" x2="690" y2="490" stroke="#000" stroke-width="2.6" marker-end="url(#ar)"/>
<text x="68" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-style="italic" fill="#000">y</text>
<text x="710" y="524" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-style="italic" fill="#000">x</text>
<text x="64" y="524" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#000">0</text>
<line x1="90" y1="300" x2="640" y2="100" stroke="#e60000" stroke-width="4" stroke-linecap="round"/>
<circle cx="90" cy="300" r="8" fill="#e60000"/>
<text x="66" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="36" font-style="italic" font-weight="bold" fill="#e60000">&#945;</text>
<path d="M102 308 q10 2 10 14 L112 387.0 q0 12 12 12 q-12 0 -12 12 L112 476 q0 12 -10 14" fill="none" stroke="#000" stroke-width="1.8" stroke-dasharray="5 4"/>
<text x="154" y="393.0" font-family="Georgia, serif" font-size="30" fill="#000">Intercept (<tspan font-style="italic">&#945;</tspan>)</text>
<text x="154" y="429.0" font-family="Georgia, serif" font-size="22" fill="#000">The value of <tspan font-style="italic">y</tspan> when <tspan font-style="italic">x</tspan> = 0</text>
</svg>