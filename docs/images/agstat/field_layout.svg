<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img">
<title>Field layout showing a central square plot with diagonals inside a larger rectangular field</title>
<desc>A 120-step by 70-step field. From the SW corner, 58 steps east and 51 steps north locate a 5 m square plot ABCD with diagonals AC and BD each 7.07 m.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="70" y="60" width="500" height="290" rx="4" fill="none" stroke="#000000" stroke-width="2"/>

<text x="66" y="368" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="700" fill="#000000">SW</text>

<rect x="330" y="120" width="90" height="90" fill="none" stroke="#000000" stroke-width="1.5"/>
<line x1="330" y1="120" x2="420" y2="210" stroke="#000000" stroke-width="1"/>
<line x1="420" y1="120" x2="330" y2="210" stroke="#000000" stroke-width="1"/>

<text x="322" y="116" text-anchor="end" font-family="sans-serif" font-size="15" font-weight="700" fill="#000000">D</text>
<text x="428" y="116" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="700" fill="#000000">C</text>
<text x="322" y="225" text-anchor="end" font-family="sans-serif" font-size="15" font-weight="700" fill="#000000">A</text>
<text x="428" y="225" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="700" fill="#000000">B</text>

<text x="375" y="112" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#000000">5 m</text>
<text x="316" y="169" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="700" fill="#000000">5 m</text>
<text x="434" y="169" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="700" fill="#000000">5 m</text>
<text x="375" y="230" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#000000">5 m</text>

<text x="150" y="105" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#000000">AC = BD = 7.07 m</text>

<line x1="330" y1="210" x2="330" y2="350" stroke="#000000" stroke-width="1" stroke-dasharray="4 4"/>

<line x1="375" y1="240" x2="375" y2="338" stroke="#000000" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="384" y="294" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="700" fill="#000000">51 steps</text>

<line x1="82" y1="330" x2="318" y2="330" stroke="#000000" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="200" y="322" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#000000">58 steps</text>

<line x1="600" y1="62" x2="600" y2="348" stroke="#000000" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="608" y="209" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="700" fill="#000000">70 steps</text>

<line x1="72" y1="380" x2="568" y2="380" stroke="#000000" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="320" y="400" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#000000">120 steps</text>
</svg>
