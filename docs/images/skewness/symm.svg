<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- Symmetric bell-shaped curve -->
  <path d="M110 650
           C210 650 300 625 390 565
           C490 498 565 390 635 250
           C690 145 742 70 800 70
           C858 70 910 145 965 250
           C1035 390 1110 498 1210 565
           C1300 625 1390 650 1490 650"
        fill="none" stroke="#111111" stroke-width="7"
        stroke-linecap="round"/>

  <!-- Horizontal axis -->
  <line x1="75" y1="650" x2="1525" y2="650"
        stroke="#111111" stroke-width="5"/>

  <!-- Tick marks -->
  <g stroke="#111111" stroke-width="5">
    <line x1="120" y1="650" x2="120" y2="625"/>
    <line x1="290" y1="650" x2="290" y2="625"/>
    <line x1="460" y1="650" x2="460" y2="625"/>
    <line x1="630" y1="650" x2="630" y2="625"/>
    <line x1="800" y1="650" x2="800" y2="625"/>
    <line x1="970" y1="650" x2="970" y2="625"/>
    <line x1="1140" y1="650" x2="1140" y2="625"/>
    <line x1="1310" y1="650" x2="1310" y2="625"/>
    <line x1="1480" y1="650" x2="1480" y2="625"/>
  </g>

  <!-- Dotted line showing the common location of mean, mode and median -->
  <line x1="800" y1="70" x2="800" y2="735"
        stroke="#111111" stroke-width="4"
        stroke-dasharray="2 14" stroke-linecap="round"/>

  <!-- Labels -->
  <g font-family="Times New Roman, Liberation Serif, serif"
     font-size="42" font-weight="700" fill="#111111"
     text-anchor="middle">
    <text x="800" y="790">Mean</text>
    <text x="800" y="840">Mode</text>
    <text x="800" y="890">Median</text>
  </g>
</svg>
