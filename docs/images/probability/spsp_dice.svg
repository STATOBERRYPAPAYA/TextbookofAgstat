<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#ffffff"/>

<defs>
<style>
.title{font-family:Arial,Helvetica,sans-serif;font-weight:700}
.text{font-family:Arial,Helvetica,sans-serif}
.green{fill:#1f5b16}
.magenta{fill:#b0009b}
</style>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
  <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.16"/>
</filter>
</defs>

<!-- Sample point heading -->
<text x="78" y="122" class="title magenta" font-size="55">Sample Point</text>

<!-- Sample space -->
<rect x="78" y="198" width="1380" height="503" rx="14"
      fill="#f4f9e9" stroke="#2c611d" stroke-width="4"/>

<text x="768" y="300" text-anchor="middle"
      class="title green" font-size="61">Sample Space</text>

<!-- Dice -->
<g filter="url(#shadow)" stroke="#111" stroke-width="2">
  <rect x="128" y="390" width="190" height="182" rx="38" fill="#fff"/>
  <rect x="345" y="390" width="190" height="182" rx="38" fill="#fff"/>
  <rect x="562" y="390" width="190" height="182" rx="38" fill="#fff"/>
  <rect x="779" y="390" width="190" height="182" rx="38" fill="#fff"/>
  <rect x="996" y="390" width="190" height="182" rx="38" fill="#fff"/>
  <rect x="1213" y="390" width="190" height="182" rx="38" fill="#fff"/>
</g>

<!-- Die 1 -->
<circle cx="223" cy="481" r="15" fill="#000"/>

<!-- Die 2 -->
<circle cx="391" cy="433" r="15" fill="#000"/>
<circle cx="489" cy="529" r="15" fill="#000"/>

<!-- Die 3 -->
<circle cx="608" cy="433" r="15" fill="#000"/>
<circle cx="657" cy="481" r="15" fill="#000"/>
<circle cx="706" cy="529" r="15" fill="#000"/>

<!-- Die 4 -->
<circle cx="827" cy="433" r="15" fill="#000"/>
<circle cx="921" cy="433" r="15" fill="#000"/>
<circle cx="827" cy="529" r="15" fill="#000"/>
<circle cx="921" cy="529" r="15" fill="#000"/>

<!-- Die 5 -->
<circle cx="1044" cy="433" r="15" fill="#000"/>
<circle cx="1138" cy="433" r="15" fill="#000"/>
<circle cx="1091" cy="481" r="15" fill="#000"/>
<circle cx="1044" cy="529" r="15" fill="#000"/>
<circle cx="1138" cy="529" r="15" fill="#000"/>

<!-- Die 6 -->
<circle cx="1264" cy="433" r="15" fill="#000"/>
<circle cx="1358" cy="433" r="15" fill="#000"/>
<circle cx="1264" cy="481" r="15" fill="#000"/>
<circle cx="1358" cy="481" r="15" fill="#000"/>
<circle cx="1264" cy="529" r="15" fill="#000"/>
<circle cx="1358" cy="529" r="15" fill="#000"/>

<!-- Outcome numbers -->
<g class="title green" font-size="49" text-anchor="middle">
  <text x="223" y="638">1</text>
  <text x="440" y="638">2</text>
  <text x="657" y="638">3</text>
  <text x="874" y="638">4</text>
  <text x="1091" y="638">5</text>
  <text x="1308" y="638">6</text>
</g>

<!-- Sample point indicator: clean magenta arrow and circle -->
<circle cx="223" cy="481" r="35" fill="none" stroke="#d000a8" stroke-width="4" stroke-dasharray="5 6"/>
<line x1="265" y1="146" x2="226" y2="429"
      stroke="#b0009b" stroke-width="8" stroke-linecap="round"/>
<path d="M226 429 L207 393 L244 398 Z" fill="#b0009b"/>

<!-- Definitions -->
<text x="365" y="812" class="title green" font-size="37">Sample Space:</text>
<text x="640" y="812" class="text" font-size="35">The set of all possible outcomes.</text>

<text x="274" y="878" class="title magenta" font-size="37">Sample Point:</text>
<text x="535" y="878" class="text" font-size="35">Any one outcome (element) in the sample space.</text>

</svg>