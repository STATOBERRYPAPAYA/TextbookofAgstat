<svg xmlns="http://www.w3.org/2000/svg" width="620" height="360" viewBox="0 0 620 360" role="img">
<title>Ogive showing the median where cumulative frequency equals N/2</title>
<desc>A cumulative frequency S-shaped curve; a dotted line from N/2 meets the curve and drops to the x-axis marking the median.</desc>
<defs>
<marker id="greenhead" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#2ecc40"/></marker>
</defs>
<rect x="0" y="0" width="620" height="360" fill="#ffffff"/>
<line x1="110" y1="30" x2="110" y2="325" stroke="#e8352a" stroke-width="2.5"/>
<line x1="108" y1="323" x2="560" y2="323" stroke="#e8352a" stroke-width="2.5"/>
<polyline fill="none" stroke="#1f6fc4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
 points="150.0,299.4 161.9,299.1 173.7,298.7 185.6,298.1 197.5,297.1 209.3,295.7 221.2,293.6 233.1,290.6 244.9,286.1 256.8,279.8 268.6,270.9 280.5,258.9 292.4,243.4 304.2,224.3 316.1,202.4 328.0,179.2 339.8,156.4 351.7,135.8 363.6,118.4 375.4,104.7 387.3,94.3 399.2,86.8 411.0,81.4 422.9,77.8 434.7,75.2 446.6,73.5 458.5,72.3 470.3,71.6 482.2,71.0 494.1,70.7"/>
<line x1="110" y1="185" x2="328" y2="185" stroke="#000000" stroke-width="1.4" stroke-dasharray="3 3"/>
<line x1="328" y1="185" x2="328" y2="322" stroke="#000000" stroke-width="1.4" stroke-dasharray="3 3"/>
<line x1="104" y1="185" x2="110" y2="185" stroke="#e8352a" stroke-width="2.5"/>
<text x="86" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#000000">N</text>
<line x1="72" y1="186" x2="100" y2="186" stroke="#000000" stroke-width="1.4"/>
<text x="86" y="204" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#000000">2</text>
<text x="34" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="19" fill="#000000" transform="rotate(-90 34 180)">Cumulative frequency</text>
<text x="330" y="352" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-style="italic" fill="#000000">x &#8594;</text>
<line x1="510" y1="205" x2="333" y2="318" stroke="#2ecc40" stroke-width="2.5" marker-end="url(#greenhead)"/>
<text x="518" y="190" text-anchor="start" font-family="Georgia, serif" font-size="21" fill="#f0413a">Median</text>
</svg>