<svg role="img" viewBox="1.5601596638655464 35.57828571428571 571.6169267707082 298.1366459627329" xmlns="http://www.w3.org/2000/svg" style="max-height: 500px" width="571.6169267707082" height="298.1366459627329">
<title>Semicircle showing the arithmetic mean as the radius over segments a and b</title>
<desc>A semicircle on a diameter split into a left segment a and a right segment b. The vertical radius from the centre to the arc equals (a+b)/2, the arithmetic mean.</desc>
<rect fill="#ffffff" height="360" width="620" y="0" x="0"/>
<path stroke-width="1.4" stroke="#7a7a7a" fill="none" d="M 60 300 A 250 250 0 0 1 560 300"/>
<line stroke-width="2.4" stroke="#6aa84f" y2="300" x2="220" y1="300" x1="60"/>
<line stroke-width="2.4" stroke="#3c78d8" y2="300" x2="560" y1="300" x1="220"/>
<line stroke-width="2.6" stroke="#000000" y2="50" x2="310" y1="300" x1="310"/>
<text fill="#000000" font-style="italic" font-size="20" font-family="Georgia, serif" text-anchor="middle" y="169.0" x="375">a + b</text>
<line stroke-width="1.4" stroke="#000000" y2="175.0" x2="413" y1="175.0" x1="337"/>
<text fill="#000000" font-size="20" font-family="Georgia, serif" text-anchor="middle" y="197.0" x="375">2</text>
<text fill="#000000" font-size="20" font-family="Georgia, serif" text-anchor="start" y="183.0" x="427">= AM</text>
<text fill="#6aa84f" font-style="italic" font-size="20" font-family="Georgia, serif" text-anchor="middle" y="330" x="140">a</text>
<text fill="#3c78d8" font-style="italic" font-size="20" font-family="Georgia, serif" text-anchor="middle" y="330" x="390">b</text>
</svg>