project:
  type: book
  output-dir: docs
  resources: 
    - assets/
    - "*.png"
    - "*.jpeg"
    - "*.jfif"
    - "*.svg" 
    - "!docs/**"
    - "!review_tools/**"
    - "!notesToadd/**"
  
book:
  title: "TEXTBOOK OF AGRICULTURAL STATISTICS"
  subtitle: "A comprehensive guide in basic statistics for agricultural research"
  favicon: images/cover.png
  author: 
    - Dr. Pratheesh P. Gopinath
    - Dr. Adarsh V.S.
    - Mohammed Hisham M.
    - Dr. Manju Mary Paul
  date: "2026-09-26"
  date-format: "D MMMM YYYY"
  reader-mode: true
  page-navigation: true
  back-to-top-navigation: true
  search: true
  site-url: https://statoberrypapaya.github.io/TextbookofAgstat/
  # repo-url: https://github.com/STATOBERRYPAPAYA/TextbookofAgstat
  image: images/cover.png
  image-alt: "Textbook of Agricultural Statistics"
  open-graph: 
    image: images/cover.png
    image-alt: "Textbook of Agricultural Statistics"
  chapters:
  - index.qmd
  - preface.qmd
  - intro.qmd
  - agstatindia.qmd
  - 3graph.qmd
  - central1.qmd
  - central2.qmd
  - dispersion.qmd
  - skewness.qmd
  - association.qmd
  - regression.qmd
  - probability.qmd
  - probabilitydist.qmd
  - sampleSurvey.qmd
  - hypothesisTest.qmd
  - largeSampletest.qmd
  - smallsampleTest.qmd
  - designofexperiments.qmd
  - uniformityTrials.qmd
  - anova.qmd
  - multipleComparison.qmd
  - singleFactor.qmd
  - factorial.qmd

  - part: "Additional Topics"
    chapters:
      - ancova.qmd
      - missingPlot.qmd
      - transformation.qmd
  appendices:
    - appendix1.qmd
    - appendix2.qmd
    - appendix3.qmd
    - appendix4.qmd
    - appendix5.qmd
    - appendix_personalities.qmd
    - references.qmd
  twitter-card: 
    image: images/cover.png
    image-alt: "Textbook of Agricultural Statistics"
    card-style: summary_large_image
  sidebar:
    logo: images/cover.png
  page-footer:
    border: true
    left: |
        Published by PAPAYA publishing division of <a href="https://www.statoberry.com/papaya">![](/images/statoberry.png){style='width: auto; height: 35px; padding-left: 10px; padding-right: 10px; margin-bottom:5px;'}</a>
    center: |
        <a href="https://www.statoberry.com/papaya">![](/images/papayalogo.png){style='width: auto; height: 90px; padding-left: 10px; padding-right: 10px; margin-bottom:5px;'}</a>
    right: |
        Licenced under [CC-BY-NC-ND 4.0 Int License](https://creativecommons.org/licenses/by-nc-nd/4.0/) <a href="http://creativecommons.org/licenses/by-nc-nd/4.0/">![](/images/cclogo.png){style='width: auto; height: 35px; padding-left: 10px; padding-right: 10px; margin-bottom:5px;'}</a>
        Built with <a href="https://quarto.org/">Quarto</a>
  cover-image: images/cover.png
  
bibliography: 
  - book.bib

format:
  html:
    include-after-body:
      text: |
        <script defer src="assets/melon-tracker.js" data-book="agricultural-statistics"></script>
    filters:
      - compact-tables.lua
    include-in-header: table-math-config.html
    mainfont: Georgia
    monofont: Fira Code
    highlight-style: arrow
    number-sections: true
    monobackgroundcolor: "#F7F7F7"  
    math: mathjax
    theme:
      light:
        - theme.css
        - theme.scss
        - lumen
      dark: 
        - darktheme.css
        - darktheme.scss
        - slate
  # pdf:
  #   documentclass: scrreprt
  #   latex-engine: xelatex
  #   header-includes:
  #     - \usepackage{float} # Ensure [H] positioning works

execute:
  code-annotations: hover
number-depth: 3
